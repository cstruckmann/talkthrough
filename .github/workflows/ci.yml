name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The suite drives the real git binary and real child processes, so it is
    # worth running on more than one platform. Windows is not covered here:
    # the exec tests use POSIX tools, and the extension's Windows story is
    # untested until someone runs it there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
